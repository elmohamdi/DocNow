name: i_clinic
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  cloud_firestore: ^6.0.3
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0

  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.3
  get_it: ^9.2.0
  liquid_navbar: ^2.0.7
  phone_form_field: ^10.0.14
  shared_preferences: ^2.5.3
  zego_uikit_prebuilt_call: ^4.22.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/images/logo2.svg

flutter_native_splash:
  color: "#FAFAFA"
  image: assets/images/logo3.png 
  android_12:
    image: assets/images/logo3.png
    color: "#FAFAFA"
  web: false

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"


